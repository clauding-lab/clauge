# Clauge V3 release pipeline (T25).
#
# Triggered on every `v*` tag push. Runs the unit-test gate, builds a
# Universal (arm64 + x86_64) macOS DMG with a Tauri-keypair-signed updater
# payload, and publishes the artifacts to a non-draft GitHub Release tied
# to the tag.
#
# Updater publication
# -------------------
# tauri-action emits `latest.json` and uploads it to the Release alongside
# the .dmg, .app.tar.gz, and .app.tar.gz.sig artifacts.  The updater
# endpoint configured in src-tauri/tauri.conf.json points at
# https://clauding-lab.github.io/clauge/latest.json — i.e. the gh-pages
# branch.  The "Mirror latest.json to gh-pages" step at the end of this
# workflow copies the latest.json from the just-published Release into the
# gh-pages branch on every tag.  The step guards on gh-pages existence:
# if the branch hasn't been bootstrapped yet (T26-c manual step), the step
# logs a ::warning:: and exits 0 — the Release itself is still published.
#
# E2E gap
# -------
# `npm run test:e2e` is intentionally NOT invoked here.  tauri-driver 2.0.6
# does not support macOS (Appium Mac2 Driver integration is upstream TODO);
# the suite at test/e2e/v3.test.ts is staged but unrunnable on macOS runners.
# See docs/RELEASE_CHECKLIST.md "E2E manual gaps" for the manual smoke that
# replaces it pre-tag.
#
# Tauri 2.x signing env-var names
# -------------------------------
# This workflow uses TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (Tauri 2.x).  The earlier 1.x names
# (TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD) are NOT recognised by the 2.x
# updater bundler and would cause silent unsigned-payload failures.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # release tags: v0.3.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # pre-release tags: v0.3.0-rc1

# Required so tauri-action can create the GitHub Release and upload assets.
permissions:
  contents: write

# Queue overlapping tag pushes rather than racing them.  cancel-in-progress is
# false on purpose: a release build that's already producing signed artifacts
# should not be killed mid-build by a second tag — let it finish, then run the
# next one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform-name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform-name: macOS universal
            runner: macos-14
            target: universal-apple-darwin
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            bundles: 'app,dmg'
            artifact-name: latest-macos.json
          - platform-name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            rust-targets: 'x86_64-pc-windows-msvc'
            bundles: 'nsis'
            artifact-name: latest-windows.json

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # v0.9.4 Phase B.2: fail fast if the four version sources have drifted.
      # TokenTracker shipped v0.5.77 once with Info.plist still on v0.5.76;
      # this step makes the same regression impossible for Clauge. Pulled
      # via an env var (TAG_NAME) rather than direct expression interpolation
      # to keep the workflow-injection scanner quiet — github.ref_name is
      # constrained by on.push.tags' SemVer glob, but belt-and-suspenders.
      - name: Verify version triple matches tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          if ! echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Tag version '$TAG_VERSION' is not SemVer-shaped"
            exit 1
          fi
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(grep -E '^version' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "tag=$TAG_VERSION  package.json=$PKG  tauri.conf.json=$TAURI  Cargo.toml=$CARGO"
          for v in "$PKG" "$TAURI" "$CARGO"; do
            if [ "$v" != "$TAG_VERSION" ]; then
              echo "::error::Version mismatch: $v != $TAG_VERSION"
              echo "::error::package.json, tauri.conf.json, Cargo.toml, and the tag must all agree."
              exit 1
            fi
          done
          echo "Versions agree: $TAG_VERSION"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-05-08
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Run JS unit tests
        env:
          SKIP_SEA_SMOKE: '1'
        run: npm test

      - name: Stub external binaries for cargo test (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          mkdir -p binaries
          touch binaries/clauge-server-aarch64-apple-darwin
          touch binaries/clauge-server-x86_64-apple-darwin
          chmod +x binaries/clauge-server-aarch64-apple-darwin binaries/clauge-server-x86_64-apple-darwin

      - name: Stub external binaries for cargo test (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          New-Item -ItemType File -Force -Path binaries\clauge-server-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Verify signing secrets are present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty or unset." >&2
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is empty or unset." >&2
            exit 1
          fi
          echo "Signing secrets present."

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          # Strip leading "v" from the tag to match CHANGELOG headers,
          # which use "## [0.9.2]" not "## [v0.9.2]".
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { found = 0 }
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG section found for [$VERSION] — release body will be empty"
          fi
          # Multi-line GitHub Actions output: heredoc delimiter pattern.
          {
            echo 'notes<<CHANGELOG_NOTES_EOF'
            echo "$NOTES"
            echo "CHANGELOG_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::group::Extracted notes for $VERSION"
          echo "$NOTES"
          echo "::endgroup::"

      - name: Build, sign, and publish artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Clauge ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: '--target ${{ matrix.target }} --bundles ${{ matrix.bundles }}'
          # includeUpdaterJson: true generates AND uploads latest.json. Both
          # matrix entries upload to the Release (last-writer-wins race —
          # harmless because the mirror-updater job overwrites with the
          # merged file at the end). Setting this to false suppresses JSON
          # generation entirely (verified v0.8.0-rc1) — find-step then can't
          # locate it on disk.
          includeUpdaterJson: true

      - name: Find and upload latest.json as artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # tauri-action with includeUpdaterJson: true uploads latest.json to
          # the Release but doesn't always leave a copy on disk in the bundle
          # dir (empirically verified on v0.8.0-rc1 retry — `Uploading
          # latest.json...` appears in the action log but find under
          # src-tauri/target returns empty). Try the broad on-disk search
          # first; fall back to downloading from the Release we just published.
          LATEST_JSON=$(find . -name 'latest.json' -type f -not -path '*/node_modules/*' 2>/dev/null | head -n 1 || true)
          if [ -z "$LATEST_JSON" ]; then
            echo "latest.json not found on disk; downloading from Release..."
            TAG="${{ github.ref_name }}"
            REPO="${{ github.repository }}"
            gh release download "$TAG" --pattern 'latest.json' --dir . --repo "$REPO"
            LATEST_JSON="./latest.json"
          fi
          echo "Found latest.json: $LATEST_JSON"
          cp "$LATEST_JSON" "${{ matrix.artifact-name }}"
          echo "Captured per-platform latest.json contents:"
          cat "${{ matrix.artifact-name }}"

      - name: Upload latest.json as workflow artifact
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}
          retention-days: 7

  mirror-updater:
    name: Merge latest.json and mirror to gh-pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download latest-macos.json
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: latest-macos.json
          path: ./macos
      - name: Download latest-windows.json
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: latest-windows.json
          path: ./windows

      - name: Merge per-platform JSONs into latest.json
        run: |
          set -euo pipefail
          # Each per-platform file has the shape:
          # { "version": "...", "notes": "...", "pub_date": "...",
          #   "platforms": { "<key>": { "url": "...", "signature": "..." } } }
          # Merge: union the platforms keys, take version/notes/pub_date from
          # macOS (both runs produce identical values for tagged builds).
          jq -s '
            .[0] as $base |
            {
              version: $base.version,
              notes: $base.notes,
              pub_date: $base.pub_date,
              platforms: ((.[0].platforms // {}) + (.[1].platforms // {}))
            }
          ' macos/latest-macos.json windows/latest-windows.json > latest.json
          echo "Merged latest.json:"
          cat latest.json

      - name: Upload merged latest.json to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

      - name: Mirror latest.json to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"

          # Guard: does gh-pages exist on remote?
          if ! git ls-remote --heads "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages | grep -q 'refs/heads/gh-pages'; then
            echo "::warning::gh-pages branch does not exist — skipping latest.json mirror."
            exit 0
          fi

          GH_PAGES_DIR=$(mktemp -d)
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$GH_PAGES_DIR"
          cp latest.json "$GH_PAGES_DIR/latest.json"

          cd "$GH_PAGES_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          if git diff --cached --quiet -- latest.json; then
            echo 'latest.json unchanged — nothing to push.'
            exit 0
          fi
          git commit -m "release: ${TAG} latest.json mirror"
          git push origin gh-pages

  dispatch-homebrew:
    name: Dispatch Homebrew tap bump
    needs: [build, mirror-updater]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip prereleases — the tap only carries the latest stable cask.
    # v0.9.2 → no hyphen → run; v0.9.2-rc1 → hyphen → skip.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Fire repository_dispatch to clauding-lab/homebrew-tap
        env:
          # Fine-grained PAT with "Contents: write" on clauding-lab/homebrew-tap.
          # Required for cross-repo /dispatches POST — the default GITHUB_TOKEN
          # is scoped to clauge itself and 403s when writing to a different repo.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          # Use the shell env var GitHub injects, not template substitution,
          # to avoid any workflow-injection surface area.
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          # Defense in depth: only allow strict SemVer-numeric tags through.
          # The on.push.tags glob already restricts stable tags to this shape,
          # but assert here in case the trigger config ever loosens.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to dispatch — VERSION '${VERSION}' is not strict SemVer."
            exit 1
          fi
          echo "Dispatching clauge-release for version ${VERSION}"
          # Build the JSON payload with jq to keep VERSION out of shell-quoting hell.
          PAYLOAD=$(jq -nc --arg v "$VERSION" \
            '{event_type: "clauge-release", client_payload: {version: $v}}')
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$PAYLOAD" \
            https://api.github.com/repos/clauding-lab/homebrew-tap/dispatches
          echo "Dispatch sent. The tap's auto-update workflow picks it up within seconds."
