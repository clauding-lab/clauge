# Clauge V3 release pipeline (T25).
#
# Triggered on every `v*` tag push. Runs the unit-test gate, builds a
# Universal (arm64 + x86_64) macOS DMG with a Tauri-keypair-signed updater
# payload, and publishes the artifacts to a non-draft GitHub Release tied
# to the tag.
#
# Updater publication
# -------------------
# tauri-action emits `latest.json` and uploads it to the Release alongside
# the .dmg, .app.tar.gz, and .app.tar.gz.sig artifacts.  The updater
# endpoint configured in src-tauri/tauri.conf.json points at
# https://clauding-lab.github.io/clauge/latest.json — i.e. the gh-pages
# branch.  The "Mirror latest.json to gh-pages" step at the end of this
# workflow copies the latest.json from the just-published Release into the
# gh-pages branch on every tag.  The step guards on gh-pages existence:
# if the branch hasn't been bootstrapped yet (T26-c manual step), the step
# logs a ::warning:: and exits 0 — the Release itself is still published.
#
# E2E gap
# -------
# `npm run test:e2e` is intentionally NOT invoked here.  tauri-driver 2.0.6
# does not support macOS (Appium Mac2 Driver integration is upstream TODO);
# the suite at test/e2e/v3.test.ts is staged but unrunnable on macOS runners.
# See docs/RELEASE_CHECKLIST.md "E2E manual gaps" for the manual smoke that
# replaces it pre-tag.
#
# Tauri 2.x signing env-var names
# -------------------------------
# This workflow uses TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (Tauri 2.x).  The earlier 1.x names
# (TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD) are NOT recognised by the 2.x
# updater bundler and would cause silent unsigned-payload failures.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # release tags: v0.3.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # pre-release tags: v0.3.0-rc1

# Required so tauri-action can create the GitHub Release and upload assets.
permissions:
  contents: write

# Queue overlapping tag pushes rather than racing them.  cancel-in-progress is
# false on purpose: a release build that's already producing signed artifacts
# should not be killed mid-build by a second tag — let it finish, then run the
# next one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform-name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform-name: macOS universal
            runner: macos-14
            target: universal-apple-darwin
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            bundles: 'app,dmg'
            artifact-name: latest-macos.json
          - platform-name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            rust-targets: 'x86_64-pc-windows-msvc'
            bundles: 'nsis'
            artifact-name: latest-windows.json

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-05-08
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Run JS unit tests
        env:
          SKIP_SEA_SMOKE: '1'
        run: npm test

      - name: Stub external binaries for cargo test (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          mkdir -p binaries
          touch binaries/clauge-server-aarch64-apple-darwin
          touch binaries/clauge-server-x86_64-apple-darwin
          chmod +x binaries/clauge-server-aarch64-apple-darwin binaries/clauge-server-x86_64-apple-darwin

      - name: Stub external binaries for cargo test (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          New-Item -ItemType File -Force -Path binaries\clauge-server-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Verify signing secrets are present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty or unset." >&2
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is empty or unset." >&2
            exit 1
          fi
          echo "Signing secrets present."

      - name: Build, sign, and publish artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Clauge ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: '--target ${{ matrix.target }} --bundles ${{ matrix.bundles }}'
          includeUpdaterJson: false

      - name: Find and upload latest.json as artifact
        shell: bash
        run: |
          set -euo pipefail
          LATEST_JSON=$(find src-tauri/target -name 'latest.json' -type f | head -n 1)
          if [ -z "$LATEST_JSON" ]; then
            echo "::error::latest.json not found after build" >&2
            exit 1
          fi
          echo "Found latest.json: $LATEST_JSON"
          cp "$LATEST_JSON" "${{ matrix.artifact-name }}"

      - name: Upload latest.json as workflow artifact
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}
          retention-days: 7
