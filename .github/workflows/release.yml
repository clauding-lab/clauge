# Clauge V3 release pipeline (T25).
#
# Triggered on every `v*` tag push. Runs the unit-test gate, builds a
# Universal (arm64 + x86_64) macOS DMG with a Tauri-keypair-signed updater
# payload, and publishes the artifacts to a non-draft GitHub Release tied
# to the tag.
#
# Updater publication
# -------------------
# tauri-action emits `latest.json` and uploads it to the Release alongside
# the .dmg, .app.tar.gz, and .app.tar.gz.sig artifacts.  The updater
# endpoint configured in src-tauri/tauri.conf.json points at
# https://clauding-lab.github.io/clauge/latest.json — i.e. the gh-pages
# branch.  The "Mirror latest.json to gh-pages" step at the end of this
# workflow copies the latest.json from the just-published Release into the
# gh-pages branch on every tag.  The step guards on gh-pages existence:
# if the branch hasn't been bootstrapped yet (T26-c manual step), the step
# logs a ::warning:: and exits 0 — the Release itself is still published.
#
# E2E gap
# -------
# `npm run test:e2e` is intentionally NOT invoked here.  tauri-driver 2.0.6
# does not support macOS (Appium Mac2 Driver integration is upstream TODO);
# the suite at test/e2e/v3.test.ts is staged but unrunnable on macOS runners.
# See docs/RELEASE_CHECKLIST.md "E2E manual gaps" for the manual smoke that
# replaces it pre-tag.
#
# Tauri 2.x signing env-var names
# -------------------------------
# This workflow uses TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (Tauri 2.x).  The earlier 1.x names
# (TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD) are NOT recognised by the 2.x
# updater bundler and would cause silent unsigned-payload failures.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # release tags: v0.3.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # pre-release tags: v0.3.0-rc1

# Required so tauri-action can create the GitHub Release and upload assets.
permissions:
  contents: write

# Queue overlapping tag pushes rather than racing them.  cancel-in-progress is
# false on purpose: a release build that's already producing signed artifacts
# should not be killed mid-build by a second tag — let it finish, then run the
# next one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build universal macOS DMG
    # Pinned to macos-14 (Sonoma, arm64) for reproducibility.  GitHub bumps
    # the `macos-latest` alias every ~12 months without notice; an explicit
    # version label means the release pipeline doesn't silently change OS
    # under us between V3.x point releases.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-05-08
        with:
          targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      # Fail fast: don't waste 10+ minutes on a Tauri build if the JS or Rust
      # tests are red.  The SEA + tauri-driver smoke suites are skipped here
      # (SEA smoke needs the binaries built first; tauri-driver doesn't run
      # on macOS yet — both are tracked elsewhere).
      #
      # SKIP_SEA_SMOKE=1 is critical: without it, sea-smoke.test.js auto-runs
      # `bash scripts/build-sidecar.sh` to produce the SEA binary, which
      # tauri-action's beforeBuildCommand then rebuilds again from scratch
      # below — wasting ~10 min and doubling exposure to nodejs.org flake.
      # The tauri-action invocation IS the SEA build smoke test in CI.
      - name: Run JS unit tests
        env:
          SKIP_SEA_SMOKE: '1'
        run: npm test

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked

      # Boolean presence check on the updater signing secrets.  If either is
      # missing, fail BEFORE invoking tauri-action — otherwise tauri-action
      # silently produces an unsigned .app.tar.gz.sig and we'd publish a
      # broken updater payload.  Do not echo lengths, hashes, or any portion
      # of the secret values; presence-only.
      - name: Verify signing secrets are present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty or unset. Refusing to publish unsigned release." >&2
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is empty or unset." >&2
            exit 1
          fi
          echo "Signing secrets present."

      # tauri-action invokes `cargo tauri build`, which honours
      # `build.beforeBuildCommand` from src-tauri/tauri.conf.json
      # (currently `bash ../scripts/build-sidecar.sh`).  The sidecar
      # script auto-detects the runner's native arch and downloads the
      # other-arch Node tarball from nodejs.org, producing both
      # clauge-server-aarch64-apple-darwin and
      # clauge-server-x86_64-apple-darwin under src-tauri/binaries/.
      # That matches the universal-apple-darwin Tauri externalBin
      # convention, so the SEA sidecar ships in the universal app bundle.
      - name: Build, sign, and publish DMG
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Clauge ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          # Universal binary: lipo-merged arm64 + x86_64 in a single .app.
          # The SEA sidecar build script handles both arches itself, so we
          # only need Tauri to produce the universal Rust shell.
          args: '--target universal-apple-darwin'
          # Emit and upload latest.json so the updater can consume it once
          # gh-pages is initialised (T26).  Until then the file is just a
          # passive Release asset.
          includeUpdaterJson: true

      # Mirror the latest.json that tauri-action just uploaded to the Release
      # into the gh-pages branch, where the auto-updater endpoint serves it.
      # Guards on gh-pages existence — until the branch is bootstrapped (T26-c),
      # this step warns and exits 0 instead of failing the release.
      - name: Mirror latest.json to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # Guard: does gh-pages exist on remote?
          if ! git ls-remote --heads "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages | grep -q 'refs/heads/gh-pages'; then
            echo "::warning::gh-pages branch does not exist — skipping latest.json mirror. Bootstrap gh-pages (T26-c) before next release."
            exit 0
          fi

          # Download the latest.json that tauri-action just uploaded
          DOWNLOAD_DIR=$(mktemp -d)
          gh release download "$TAG" --pattern 'latest.json' --dir "$DOWNLOAD_DIR" --repo "$REPO"

          # Clone gh-pages, swap latest.json, push
          GH_PAGES_DIR=$(mktemp -d)
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$GH_PAGES_DIR"

          cp "$DOWNLOAD_DIR/latest.json" "$GH_PAGES_DIR/latest.json"

          cd "$GH_PAGES_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage first, then check the index against HEAD: this catches both
          # the "file changed" and "file is brand-new on gh-pages" cases.
          # Using `git diff --quiet HEAD -- latest.json` directly would miss
          # untracked-new-file because diff ignores untracked paths.
          git add latest.json
          if git diff --cached --quiet -- latest.json; then
            echo 'latest.json unchanged — nothing to push.'
            exit 0
          fi

          git commit -m "release: ${TAG} latest.json mirror"
          git push origin gh-pages
