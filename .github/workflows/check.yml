name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Rust
        run: |
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Node deps
        run: npm ci

      - name: Build SEA sidecar
        # tauri-build's externalBin validation requires the sidecar binary
        # to exist at src-tauri/binaries/ before cargo clippy / cargo test
        # can compile the build.rs. The sidecar is gitignored, so CI must
        # build it before the lint/test gates run.
        run: npm run build:sidecar

      - name: Run check (fmt + clippy strict + cargo test + npm test)
        run: npm run check
