name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Rust
        run: |
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Node deps
        run: npm ci

      - name: Build SEA sidecar
        # tauri-build's externalBin validation requires the sidecar binary
        # to exist at src-tauri/binaries/ before cargo clippy / cargo test
        # can compile the build.rs. The sidecar is gitignored, so CI must
        # build it before the lint/test gates run.
        run: npm run build:sidecar

      - name: Run check (fmt + clippy strict + cargo test + npm test)
        run: npm run check

  # The release builds a Windows artifact, but the gate above runs on macOS
  # only — so a non-portable JS test (e.g. POSIX file perms) only failed at the
  # release gate, the most expensive place to find out (v1.3.0 half-published
  # before this job existed). Run the JS suite on Windows too so portability
  # breaks are caught pre-merge. See AGENT_LEARNINGS 2026-06-13.
  # NOTE: add "js-tests-windows" to the branch's required status checks to make
  # it blocking — otherwise it surfaces failures but won't prevent merge.
  js-tests-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Run JS unit tests
        run: npm test
