[package]
name = "clauge"
version = "1.3.5"
description = "Clauge — Claude Code analytics native shell"
authors = ["clauding-lab"]
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
# v0.9.0: Mac App Store sandboxed flavor. When enabled:
#  - keychain.rs MAS branch reads ~/.claude/.credentials.json via filesystem
#    (zero-arg signature; reads path from MAS_CLAUDE_DIR OnceLock populated by
#    the supervisor on acquire_scoped_path)
#  - security_scoped_bookmark.rs module compiles in
#  - tauri_plugin_updater is NOT registered (App Store owns updates)
#  - check_for_updates IPC opens macappstore:// instead of polling latest.json
#  - is_mas_flavor IPC returns true
#
# Note: objc2 + objc2-foundation are NOT optional Cargo deps — native_popover.rs
# uses them unconditionally on macOS for the NSStatusItem / NSPopover surface
# (both flavors), so making them optional would break the DMG build. The MAS
# feature is purely a source-code cfg gate; the bookmark module's reach into
# objc2-foundation reuses the base-line deps and just enables additional
# features (NSError, NSArray) on the existing `objc2-foundation` entry.
mas = []

[lib]
name = "clauge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# `macos-private-api` is required on the base line (not per-target) because
# tauri-build's allowlist check (build.rs) walks Cargo.toml's [dependencies]
# table only — it doesn't union per-target blocks. Adding it here matches
# `app.macOSPrivateApi: true` in tauri.conf.json. Tauri's own internal
# cfg-gates restrict the actual macOS-private API usage to target_os="macos",
# so requesting the feature on non-Apple targets is harmless. See Phase 1
# Task 3 + Phase 7 Task C postmortem in the Windows port plan.
tauri = { version = "2.0", features = ["macos-private-api", "tray-icon", "image-png", "devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-store = "2.0"
# v0.9.0: dialog plugin is used by the MAS-flavor security-scoped bookmark
# module to present NSOpenPanel for the user-granted ~/.claude/ read access.
# Registered unconditionally to keep the builder chain simple — dormant if no
# code calls it; ACL gates frontend access (none granted in main.json).
tauri-plugin-dialog = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
window-vibrancy = "0.6"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
thiserror = "1"
once_cell = "1.19"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
security-framework = "2.11"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView", "NSPanel", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSImage", "NSEvent", "NSPopover", "NSViewController", "NSApplication", "NSControl", "NSButton", "NSCell"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
# Phase ②b adds NSFileManager (URLForUbiquityContainerIdentifier +
# createDirectoryAtURL), NSFileCoordinator (coordinated iCloud write), and
# block2 (the accessor block the coordinate-writing method takes). These
# un-gate already-vendored bindings — no net-new download. NSFilePresenter is
# deliberately NOT added: we use NSFileCoordinator::new(), not initWithFilePresenter.
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSURL", "NSURLRequest", "NSValue", "NSData", "NSDictionary", "NSError", "NSArray", "NSProcessInfo", "NSFileManager", "NSFileCoordinator", "block2"] }
# block2: lets us name `block2::RcBlock` to construct the accessor block that
# NSFileCoordinator's coordinateWritingItemAtURL:options:error:byAccessor: takes
# (Phase ②b coordinated iCloud write). Already in Cargo.lock at 0.6.2 via the
# objc2-foundation `block2` feature; declared directly so it's referenceable.
block2 = "0.6"
# v0.9.10: MAS launch-at-login uses Apple's ServiceManagement SMAppService
# (sandbox-correct, macOS 13+). Compiled unconditionally on macOS like the other
# objc2 framework crates above; only referenced from the `mas`-gated
# autostart_mas module (dormant in the DMG build). The runtime macOS-13 guard
# (NSProcessInfo::isOperatingSystemAtLeastVersion) lets the minimumSystemVersion
# stay at 12.0 — autostart degrades on 12, the rest of the app still runs.
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler", "WKNavigation", "WKNavigationDelegate"] }
# v0.9.0: libproc + libc replace the lsof + kill shell-out in
# port_discovery::kill_pid_on_port_unix on macOS. Apple's App Sandbox
# blocks /usr/sbin/lsof (it needs proc_info/sysctl calls the sandbox
# denies), so the previous shell-out silently no-op'd inside the MAS
# build and orphan sidecars on port 3456 survived launch, hijacking
# /api/health and /api/usage/ingest. libproc walks user-owned PIDs and
# their FDs in-process via proc_listpids + proc_pidfdinfo (no subprocess
# spawn, no entitlement change), and libc::kill issues SIGKILL directly.
# DMG (non-MAS) on macOS also benefits — faster, no Command spawn cost.
libproc = "0.14"
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.5"
serial_test = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
