[package]
name = "clauge"
version = "0.7.3"
description = "Clauge — Claude Code analytics native shell"
authors = ["clauding-lab"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clauge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-store = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
window-vibrancy = "0.6"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
thiserror = "1"
once_cell = "1.19"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
objc2 = "0.6"
security-framework = "2.11"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView", "NSPanel", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSImage", "NSEvent", "NSPopover", "NSViewController", "NSApplication", "NSControl", "NSButton", "NSCell"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSURL", "NSURLRequest", "NSValue", "NSData", "NSDictionary"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler", "WKNavigation", "WKNavigationDelegate"] }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.5"
serial_test = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
